name: Rebuild PDFs

on:
  push:
    branches: [main]
    paths: [devices.yaml, sheets.yaml, generate.py]
  pull_request:
    paths: [devices.yaml, sheets.yaml, generate.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate device data
        run: python generate.py --check
      - name: Render sheets
        run: python generate.py --all-sheets
      - name: Commit regenerated PDFs
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rebuild PDFs"
          file_pattern: "pdf/*.pdf"
