# Device dimensions for print-at-actual-size templates.
#
# Rules for adding a device:
#   - Body and screen figures must come from the manufacturer's own spec page. Put the URL in `source`.
#   - Body width/height are in the orientation you want drawn on paper. For a foldable's open
#     state that is usually landscape, exactly as the manufacturer lists it.
#   - Screen is given as pixels plus ppi, in the same orientation as the body (px_w runs along body width).
#     The generator computes the physical active area from these, which is more accurate than a quoted diagonal.
#   - corner_radius_mm is an estimate for a nicer cut line. Manufacturers do not publish it. Say so if you measured it.
#   - hinge: vertical | horizontal | null. Draws a dashed fold line through the middle of that state.
#   - diagonal_in is optional. If present, `generate.py --check` warns when the computed diagonal disagrees by more than 0.05 in.

devices:

  - id: iphone-18-pro
    name: iPhone 18 Pro
    maker: Apple
    released: 2026-09
    source: https://www.apple.com/iphone-18-pro/specs/
    states:
      - body: {w: 71.9, h: 150.0, d: 8.75}
        weight_g: 211
        screen: {px_w: 1206, px_h: 2622, ppi: 460, diagonal_in: 6.27}
        corner_radius_mm: 12

